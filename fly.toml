# Fly.io config. `fly launch` fills in the app name and region.
# The game keeps rooms and live matches in memory, so it must run as a
# single always-on machine.

[build]

[env]
  NODE_ENV = "production"
  DAILY_STATE_PATH = "/data/daily.json"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
