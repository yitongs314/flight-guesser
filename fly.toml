# fly.toml app configuration file generated for flight-guesser on 2026-08-13T17:31:14-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flight-guesser'
primary_region = 'sjc'

[build]
[env]
  DAILY_STATE_PATH = '/data/daily.json'
  NODE_ENV = 'production'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
